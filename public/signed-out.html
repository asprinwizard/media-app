<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed out · Media02</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #f9f9f8; --card: #fff; --text: #21201c; --muted: #63635e; --line: #e4e4e0; --accent: #ffc53d; --accent-text: #21201c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --card: #191918; --text: #eeeeec; --muted: #b5b3ad; --line: #2e2e2b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 400px; padding: 32px 28px; text-align: center;
         background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .logo { width: 48px; height: 48px; margin-bottom: 12px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
  a.button { display: inline-block; padding: 10px 18px; border-radius: 8px; background: var(--accent); color: var(--accent-text);
             font-weight: 600; text-decoration: none; }
  a.button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  small { display: block; margin-top: 18px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/favicon.svg" alt="">
  <h1>You've signed out</h1>
  <p>Media02 has forgotten your login on this browser.</p>
  <a class="button" href="/">Sign in again</a>
  <small>If the site opens without asking for your password, close every browser window to finish signing out.</small>
</main>
</body>
</html>
